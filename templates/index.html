<!DOCTYPE html>
<html>
<head>
    <title>AV2 Encoder</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; }
        input[type="number"] { width: 100px; }
        .log-box { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; height: 200px; overflow-y: scroll; margin-top: 20px; white-space: pre-wrap;}
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AV2 Web Encoder</h1>
    
    <div class="form-group">
        <label>Media File:</label>
        <input type="file" id="file" />
    </div>
    <div class="form-group">
        <label>Threads:</label>
        <input type="number" id="threads" value="32" min="1" max="128" />
    </div>
    <div class="form-group">
        <label>CPU Used (0-9):</label>
        <input type="number" id="cpu_used" value="9" min="0" max="9" />
    </div>
    <div class="form-group">
        <label>Frame Limit:</label>
        <input type="number" id="limit" placeholder="Blank for all" />
    </div>
    
    <button onclick="startEncoding()">Upload & Encode</button>

    <div id="result"></div>
    <div class="log-box" id="logBox">Logs will appear here...</div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        function startEncoding() {
            const fileInput = document.getElementById('file');
            if (fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("threads", document.getElementById('threads').value);
            formData.append("cpu_used", document.getElementById('cpu_used').value);
            
            const limit = document.getElementById('limit').value;
            if(limit) {
                formData.append("limit", limit);
            }

            document.getElementById('result').innerText = "Uploading...";
            
            fetch("/upload", {
                method: "POST",
                body: formData
            }).then(resp => resp.json()).then(data => {
                if(data.error) {
                    alert(data.error);
                    return;
                }
                currentTaskId = data.task_id;
                document.getElementById('result').innerText = "Encoding in progress...";
                if(pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollStatus, 2000);
            }).catch(e => {
                alert("Upload failed: " + e);
            });
        }

        function pollStatus() {
            if(!currentTaskId) return;

            fetch("/status/" + currentTaskId)
                .then(r => r.json())
                .then(data => {
                    const lb = document.getElementById('logBox');
                    lb.innerText = data.log.join('\n');
                    lb.scrollTop = lb.scrollHeight;

                    if(data.status === 'done') {
                        clearInterval(pollInterval);
                        const downloadUrl = "/download/" + currentTaskId;
                        document.getElementById('result').innerHTML = `Encoding successful! <a href="${downloadUrl}">Download MP4</a>`;
                    } else if(data.status === 'error') {
                        clearInterval(pollInterval);
                        document.getElementById('result').innerHTML = "<span style='color:red;'>Encoding failed! Check logs.</span>";
                    }
                });
        }
    </script>
</body>
</html>
