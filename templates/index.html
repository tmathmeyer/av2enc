<!DOCTYPE html>
<html>
<head>
    <title>AV2 Encoder & Queue</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 140px; }
        input[type="number"] { width: 100px; }
        .log-box { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; height: 150px; overflow-y: scroll; margin-top: 10px; white-space: pre-wrap; display: none;}
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .status-done { color: green; font-weight: bold; }
        .status-error { color: red; font-weight: bold; }
        .status-encoding { color: orange; font-weight: bold; }
        .status-queued { color: gray; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AV2 Web Encoder</h1>
    
    <div style="background: #f9f9f9; padding: 15px; border: 1px solid #ddd; margin-bottom: 30px;">
        <h3>New Encoding Job</h3>
        <div class="form-group">
            <label>Media File:</label>
            <input type="file" id="file" />
        </div>
        <div class="form-group">
            <label>Threads:</label>
            <input type="number" id="threads" value="32" min="1" max="128" />
        </div>
        <div class="form-group">
            <label>CPU Used (0-9):</label>
            <input type="number" id="cpu_used" value="9" min="0" max="9" />
        </div>
        <div class="form-group">
            <label>Frame Limit:</label>
            <input type="number" id="limit" placeholder="Blank for all" />
        </div>
        
        <button onclick="startEncoding()">+ Add to Queue</button>
        <span id="upload-status" style="margin-left: 15px; color: blue;"></span>
    </div>

    <h3>Encoding Queue & History</h3>
    <table>
        <thead>
            <tr>
                <th>File</th>
                <th>Status</th>
                <th>Params</th>
                <th>Time (s)</th>
                <th>Action / Log</th>
            </tr>
        </thead>
        <tbody id="history-tbody">
            <!-- Populated via JS -->
        </tbody>
    </table>

    <div class="log-box" id="logBox"></div>

    <script>
        let pollInterval = setInterval(fetchHistory, 2000);
        let activeLogTask = null;

        function startEncoding() {
            const fileInput = document.getElementById('file');
            if (fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("threads", document.getElementById('threads').value);
            formData.append("cpu_used", document.getElementById('cpu_used').value);
            
            const limit = document.getElementById('limit').value;
            if(limit) {
                formData.append("limit", limit);
            }

            document.getElementById('upload-status').innerText = "Uploading...";
            
            fetch("/upload", {
                method: "POST",
                body: formData
            }).then(resp => resp.json()).then(data => {
                if(data.error) {
                    alert(data.error);
                    return;
                }
                document.getElementById('upload-status').innerText = "Added to queue!";
                document.getElementById('file').value = ""; // clear file
                setTimeout(() => { document.getElementById('upload-status').innerText = ""; }, 3000);
                fetchHistory(); // trigger immediate ui update
            }).catch(e => {
                alert("Upload failed: " + e);
                document.getElementById('upload-status').innerText = "";
            });
        }

        function fetchHistory() {
            fetch("/history")
                .then(r => r.json())
                .then(data => {
                    const tbody = document.getElementById('history-tbody');
                    tbody.innerHTML = "";
                    
                    if (Object.keys(data).length === 0) {
                        tbody.innerHTML = "<tr><td colspan='5'>No history yet.</td></tr>";
                        return;
                    }

                    // Sort by queued_time descending
                    const tasks = Object.entries(data).sort((a, b) => b[1].queued_time - a[1].queued_time);
                    
                    let isEncoding = false;

                    tasks.forEach(([taskId, task]) => {
                        const tr = document.createElement('tr');
                        
                        let paramStr = `T=${task.params.threads}, C=${task.params.cpu_used}`;
                        if (task.params.limit) paramStr += `, L=${task.params.limit}`;

                        let timeStr = "-";
                        if (task.elapsed_seconds) {
                            timeStr = task.elapsed_seconds.toFixed(1) + "s";
                        }

                        let actionHtml = `<button onclick="viewLog('${taskId}')">View Log</button>`;
                        if (task.status === 'done') {
                            actionHtml += ` <a href="/download/${taskId}" target="_blank">Download MP4</a>`;
                        }
                        
                        if (task.status === 'encoding') isEncoding = true;

                        tr.innerHTML = `
                            <td>${task.filename}</td>
                            <td class="status-${task.status}">${task.status.toUpperCase()}</td>
                            <td>${paramStr}</td>
                            <td>${timeStr}</td>
                            <td>${actionHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // Update live logs if viewing active task
                    if (activeLogTask && data[activeLogTask]) {
                        const t = data[activeLogTask];
                        const lb = document.getElementById('logBox');
                        lb.innerText = `Logs for: ${t.filename}\n\n` + t.log.join('\n');
                        lb.scrollTop = lb.scrollHeight;
                    }
                });
        }

        function viewLog(taskId) {
            activeLogTask = taskId;
            document.getElementById('logBox').style.display = 'block';
            fetchHistory();
        }

        fetchHistory();
    </script>
</body>
</html>
